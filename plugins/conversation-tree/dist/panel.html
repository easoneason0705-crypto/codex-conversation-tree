<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>對話樹</title><style>:root {
  font-family:var(--font-sans,Inter,"Segoe UI","Microsoft JhengHei",sans-serif);
  font-synthesis:none;
  --palette-bg:#181818;
  --palette-canvas:#151515;
  --palette-panel:#232323;
  --palette-panel-subtle:#202020;
  --palette-panel-hover:#303030;
  --palette-text:#ededed;
  --palette-muted:#a0a0a0;
  --palette-line:#363636;
  --palette-line-strong:#505050;
  --palette-edge:#666666;
  --palette-grid:#ffffff0d;
  --palette-focus:#b5b5b5;
  --palette-selected:#bcbcbc;
  --palette-selected-ring:#ffffff14;
  --palette-shadow:#00000030;
  --palette-shadow-strong:#00000070;
  --palette-overlay:#00000099;
  --palette-danger:#f28b82;
  --palette-primary-bg:#e5e5e5;
  --palette-primary-text:#181818;
  --palette-primary-hover-bg:#fff;
  --palette-primary-hover-text:#111;
  --palette-zoom:#202020dd;
  --palette-dot:#b0b0b0;
  --tree-bg:var(--palette-bg);
  --tree-canvas:var(--palette-canvas);
  --tree-panel:var(--palette-panel);
  --tree-panel-subtle:var(--palette-panel-subtle);
  --tree-panel-hover:var(--palette-panel-hover);
  --tree-text:var(--palette-text);
  --tree-muted:var(--palette-muted);
  --tree-line:var(--palette-line);
  --tree-line-strong:var(--palette-line-strong);
  --tree-edge:var(--palette-edge);
  --tree-grid:var(--palette-grid);
  --tree-focus:var(--palette-focus);
  --tree-selected:var(--palette-selected);
  --tree-selected-ring:var(--palette-selected-ring);
  --tree-shadow:var(--palette-shadow);
  --tree-shadow-strong:var(--palette-shadow-strong);
  --tree-overlay:var(--palette-overlay);
  --tree-danger:var(--palette-danger);
  --tree-primary-bg:var(--palette-primary-bg);
  --tree-primary-text:var(--palette-primary-text);
  --tree-primary-hover-bg:var(--palette-primary-hover-bg);
  --tree-primary-hover-text:var(--palette-primary-hover-text);
  --tree-zoom:var(--palette-zoom);
  --tree-dot:var(--palette-dot);
}

:root[data-theme="light"] {
  --palette-bg:#f7f7f7;
  --palette-canvas:#fbfbfb;
  --palette-panel:#fff;
  --palette-panel-subtle:#f2f2f2;
  --palette-panel-hover:#ededed;
  --palette-text:#202020;
  --palette-muted:#686868;
  --palette-line:#d7d7d7;
  --palette-line-strong:#b8b8b8;
  --palette-edge:#a4a4a4;
  --palette-grid:#0000000d;
  --palette-focus:#575757;
  --palette-selected:#686868;
  --palette-selected-ring:#00000012;
  --palette-shadow:#00000016;
  --palette-shadow-strong:#0000002b;
  --palette-overlay:#00000059;
  --palette-danger:#b42318;
  --palette-primary-bg:#202020;
  --palette-primary-text:#fff;
  --palette-primary-hover-bg:#3a3a3a;
  --palette-primary-hover-text:#fff;
  --palette-zoom:#fffffff0;
  --palette-dot:#777;
}

:root[data-theme-source="host"] {
  --tree-bg:var(--color-background-primary,var(--palette-bg));
  --tree-canvas:var(--color-background-primary,var(--palette-canvas));
  --tree-panel:var(--color-background-secondary,var(--palette-panel));
  --tree-panel-subtle:var(--color-background-tertiary,var(--palette-panel-subtle));
  --tree-panel-hover:var(--color-background-tertiary,var(--palette-panel-hover));
  --tree-text:var(--color-text-primary,var(--palette-text));
  --tree-muted:var(--color-text-secondary,var(--palette-muted));
  --tree-line:var(--color-border-primary,var(--palette-line));
  --tree-line-strong:var(--color-border-secondary,var(--palette-line-strong));
  --tree-focus:var(--color-ring-primary,var(--palette-focus));
  --tree-danger:var(--color-text-danger,var(--palette-danger));
  --tree-primary-bg:var(--color-text-primary,var(--palette-primary-bg));
  --tree-primary-text:var(--color-background-primary,var(--palette-primary-text));
}

*{box-sizing:border-box}
html,body{background:var(--tree-bg);color:var(--tree-text)}
body{margin:0}
main{max-width:1100px;margin:auto;padding:14px 26px 16px}
button,input,select{font:inherit}
button,select{border:1px solid var(--tree-line);border-radius:8px;color:var(--tree-text);background:var(--tree-panel);cursor:pointer;font-size:12px}
button{padding:8px 12px}
button:hover:not(:disabled),select:hover{border-color:var(--tree-line-strong);background:var(--tree-panel-hover)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--tree-focus);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.48}
.quiet{background:transparent;border-color:transparent}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.8px;color:var(--tree-text)}
.eyebrow span{font-weight:400;color:var(--tree-muted);float:right;letter-spacing:1px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
h1{font-size:24px;letter-spacing:-.7px;font-weight:600;margin:0}
h2{font-size:16px;font-weight:600;margin:12px 0}
.badge{font-size:10px;white-space:nowrap;color:var(--tree-text);padding:5px 8px;border:1px solid var(--tree-line-strong);border-radius:20px}
.subtitle{font-size:12px;color:var(--tree-muted);line-height:1.8;margin:8px 0 24px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:3px;padding:3px;background:var(--tree-panel-subtle);border-radius:9px}
.tabs button{border:0;background:transparent;color:var(--tree-muted);padding:7px 13px}
.tabs button[aria-pressed=true]{background:var(--tree-panel);color:var(--tree-text);box-shadow:0 1px 3px var(--tree-shadow)}
.source{font-size:11px;color:var(--tree-muted);display:flex;align-items:center;gap:7px;margin:0;min-width:0;flex:1}
.source #source{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:6px;height:6px;background:var(--tree-dot);flex:none;border-radius:50%}
.pathbar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--tree-line);padding:10px 0;font-size:12px}
.pathbar>span{font-weight:600}
.canvas{position:relative;overflow:auto;height:420px;max-height:none;min-height:200px;resize:vertical;border:1px solid var(--tree-line);border-radius:13px;background-color:var(--tree-canvas);background-image:radial-gradient(var(--tree-grid) .8px,transparent .8px);background-size:16px 16px;cursor:grab;touch-action:none;overscroll-behavior:contain}
.canvas.panning{cursor:grabbing}
.canvas.panning .graph{pointer-events:none}
.graph{position:relative;min-width:100%;min-height:200px}
#edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--tree-edge);stroke-width:1.5}
.node{position:absolute;width:180px;height:68px;border:1px solid var(--tree-line);border-radius:10px;background:var(--tree-panel);box-shadow:0 3px 8px var(--tree-shadow);transition:border-color .15s,box-shadow .15s;user-select:none}
.node.selected{border-color:var(--tree-selected);box-shadow:0 0 0 2px var(--tree-selected-ring)}
.node.select-branch{border-style:dashed;background:var(--tree-panel-subtle)}
.node-main{border:0;width:100%;height:100%;text-align:left;background:transparent!important;padding:11px 13px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.node-title{width:100%;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.node-meta{font-size:10px;color:var(--tree-muted)}
.fork{position:absolute;right:-7px;top:-14px;border-color:var(--tree-line-strong);box-shadow:0 2px 5px var(--tree-shadow);opacity:0;transform:translateY(3px);transition:.15s;background:var(--tree-panel-hover);padding:5px 8px;color:var(--tree-text);z-index:2}
.node:hover .fork,.node:focus-within .fork{opacity:1;transform:none}
.drag-handle{position:absolute;left:-7px;top:-7px;z-index:4;width:16px;height:16px;min-width:16px;padding:0;border:2px solid var(--tree-muted);border-radius:50%;background:var(--tree-panel-subtle);box-shadow:0 1px 4px var(--tree-shadow-strong);cursor:grab;touch-action:none}
.drag-handle:hover,.drag-handle:focus-visible{border-color:var(--tree-text);background:var(--tree-panel-hover)}
.node.dragging{z-index:20;border-color:var(--tree-selected);box-shadow:0 10px 26px var(--tree-shadow-strong);transition:none}
.node.dragging .drag-handle{cursor:grabbing;border-color:var(--tree-text);background:var(--tree-panel-hover)}
.empty{padding:50px 24px;color:var(--tree-muted);font-size:12px;text-align:center;line-height:2}
.notice{padding:11px 13px;font-size:12px;background:var(--tree-panel-subtle);border:1px solid var(--tree-line-strong);border-radius:8px;line-height:1.7;margin-bottom:13px}
.detail{margin-top:18px;border:1px solid var(--tree-line);border-radius:12px;padding:16px;background:var(--tree-panel)}
.detail-top{display:flex;justify-content:space-between;align-items:center}
.detail h2{line-height:1.6}
.detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:13px;line-height:1.9;max-height:220px;overflow:auto;margin:10px 0 16px}
.detail-actions{display:flex;gap:7px;flex-wrap:wrap}
.small{font-size:11px;line-height:1.7;color:var(--tree-muted);margin-bottom:0}
footer{display:flex;justify-content:space-between;font-size:10px;color:var(--tree-muted);padding:14px 2px}
.diagnostics{border-top:1px solid var(--tree-line);font-size:11px;color:var(--tree-muted);padding-top:14px}
.diagnostics summary{cursor:pointer}
.diagnostics p{line-height:1.9}
.diagnostics pre{font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere}
dialog{border:1px solid var(--tree-line);border-radius:15px;padding:25px;max-width:400px;width:calc(100% - 32px);color:var(--tree-text);background:var(--tree-panel)}
dialog::backdrop{background:var(--tree-overlay);backdrop-filter:blur(3px)}
dialog p{font-size:12px;line-height:1.8;color:var(--tree-muted)}
dialog label{font-size:12px;display:block;margin:15px 0 7px}
input{width:100%;padding:11px;border:1px solid var(--tree-line);border-radius:7px;color:var(--tree-text);background:var(--tree-bg)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.primary{color:var(--tree-primary-text);background:var(--tree-primary-bg);border-color:var(--tree-primary-bg)}
.primary:hover:not(:disabled){background:var(--tree-primary-hover-bg);color:var(--tree-primary-hover-text)}
.error{color:var(--tree-danger);margin-bottom:0}
.zoom{position:sticky;left:10px;top:10px;z-index:40;width:max-content;margin:10px 0 -25px 10px;padding:4px 7px;border:1px solid var(--tree-line-strong);border-radius:6px;background:var(--tree-zoom);color:var(--tree-muted);font-size:10px;pointer-events:none;backdrop-filter:blur(4px)}
.compactbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.compact-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.tree-pickers{display:flex;align-items:center;gap:6px;min-width:0}
.tree-pickers select{max-width:190px;min-width:110px;padding:6px 26px 6px 9px;font-size:11px;text-overflow:ellipsis}
.theme-picker{width:82px;padding:6px 7px;font-size:11px}
[hidden]{display:none!important}

@media(max-width:720px){
  .compactbar{align-items:flex-start;flex-wrap:wrap}
  .source{flex-basis:100%}
  .compact-actions{width:100%;flex-wrap:wrap}
  .tree-pickers{flex:1}
  .tree-pickers select{max-width:none;width:50%}
}

@media(max-width:480px){
  main{padding:20px 15px 12px}
  h1{font-size:20px}
  .badge{font-size:9px}
  .subtitle{margin-bottom:16px}
  .fork{opacity:1;transform:none;top:-10px;font-size:10px}
  .node{width:166px}
  footer{font-size:9px}
  .tree-pickers{flex-basis:100%}
  .theme-picker{margin-left:auto}
}
</style></head>
<body>
  <main>
    <div class="compactbar"><div class="source"><span class="dot"></span><span id="source">讀取本機提示詞…</span></div><div class="compact-actions"><div id="tree-pickers" class="tree-pickers" hidden><select id="workspace-picker" aria-label="切換 Codex 項目"></select><select id="root-picker" aria-label="切換主線聊天"></select></div><select id="theme-picker" class="theme-picker" aria-label="插件外觀" title="插件外觀"><option value="auto">◐ 自動</option><option value="light">☀ 淺色</option><option value="dark">● 深色</option></select><button id="refresh" class="quiet">↻ 更新</button></div></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="pathbar"><span id="path">主線</span><button id="mainline" class="quiet">回到主線 ↗</button></div>
    <section id="canvas" class="canvas" aria-label="對話樹；按住空白處可移動畫布"><div id="zoom" class="zoom" aria-live="polite">100%</div><div id="graph" class="graph"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div><div id="empty" class="empty" hidden>還沒有提示詞。發送第一則訊息後，這裡會長出第一個節點。</div></section>
    <section id="detail" class="detail" hidden><div class="detail-top"><span class="eyebrow">選中的提示詞</span><button id="rename" class="quiet">重新命名</button></div><h2 id="detail-title"></h2><pre id="prompt"></pre><div class="detail-actions"><button id="copy" class="quiet">複製提示詞</button><button disabled title="由桌面橋接觸發 Codex 原生提示詞導覽條">原生定位 · 桌面橋接</button></div><p id="detail-hint" class="small"></p></section>
    <footer><span id="count">0 個節點</span><span id="sync">每 3 秒讀取本機歷史</span></footer>
    <details class="diagnostics"><summary>原型能力與限制</summary><p>點節點會先請求開啟所屬聊天，再由桌面橋接觸發 Codex 原生小白條。建立分支後會切換到新聊天，回到主線亦同。桌面橋接需要使用專用啟動器啟動 Codex。分支共用工作目錄。</p><p>目前顯示設定的主線、插件建立的分支，以及它們的原生後代分支。節點標題先使用原文短句，可手動改名。</p><pre id="diagnostic-text">等待宿主連接</pre></details>
  </main>
  <dialog id="dialog"><form id="branch-form"><div class="eyebrow">EXPLORE A BRANCH</div><h2 id="dialog-title">從這裡建立分支</h2><p id="dialog-description"></p><label for="branch-name">名稱</label><input id="branch-name" maxlength="60" required autocomplete="off" placeholder="例如：買雞蛋"><div class="dialog-actions"><button type="button" id="cancel" class="quiet">取消</button><button type="submit" id="confirm" class="primary">建立分支</button></div><p id="dialog-error" class="error" role="alert"></p></form></dialog>
