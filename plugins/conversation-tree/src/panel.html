<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="appTitle">對話樹</title><style>/* INLINE_STYLE */</style></head>
<body>
  <main>
    <div class="compactbar"><div class="source"><span class="dot"></span><span id="source" data-i18n="loadingPrompts">讀取本機提示詞…</span></div><div class="compact-actions"><div id="tree-pickers" class="tree-pickers" hidden><select id="workspace-picker" aria-label="切換 Codex 項目" data-i18n-aria-label="switchProject"></select><select id="root-picker" aria-label="切換主線聊天" data-i18n-aria-label="switchMainChat"></select></div><select id="theme-picker" class="theme-picker" aria-label="插件外觀" title="插件外觀" data-i18n-aria-label="appearance" data-i18n-title="appearance"><option value="auto" data-i18n="themeAuto">◐ 自動</option><option value="light" data-i18n="themeLight">☀ 淺色</option><option value="dark" data-i18n="themeDark">● 深色</option></select><button id="refresh" class="quiet" data-i18n="refresh">↻ 更新</button></div></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="pathbar"><span id="path" data-i18n="mainline">主線</span><button id="mainline" class="quiet" data-i18n="returnMainline">回到主線 ↗</button></div>
    <section id="canvas" class="canvas" aria-label="對話樹；按住空白處可移動畫布" data-i18n-aria-label="canvasAria"><div id="zoom" class="zoom" aria-live="polite">100%</div><div id="graph" class="graph"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div><div id="empty" class="empty" hidden data-i18n="emptyTree">還沒有提示詞。發送第一則訊息後，這裡會長出第一個節點。</div></section>
    <section id="detail" class="detail" hidden><div class="detail-top"><span class="eyebrow" data-i18n="selectedPrompt">選中的提示詞</span><button id="rename" class="quiet" data-i18n="rename">重新命名</button></div><h2 id="detail-title"></h2><pre id="prompt"></pre><div class="detail-actions"><button id="copy" class="quiet" data-i18n="copyPrompt">複製提示詞</button><button disabled title="由桌面橋接觸發 Codex 原生提示詞導覽條" data-i18n="nativeNavigation" data-i18n-title="nativeNavigationTitle">原生定位 · 桌面橋接</button></div><p id="detail-hint" class="small"></p></section>
    <footer><span id="count" data-i18n="zeroNodes">0 個節點</span><span id="sync" data-i18n="polling">每 3 秒讀取本機歷史</span></footer>
    <details class="diagnostics"><summary data-i18n="diagnosticsSummary">能力與限制</summary><p data-i18n="diagnosticsOne">點節點會先請求開啟所屬聊天，再由桌面橋接觸發 Codex 原生導覽條。建立分支後會切換到新聊天，回到主線亦同。桌面橋接需要使用專用啟動器啟動 Codex。分支共用工作目錄。</p><p data-i18n="diagnosticsTwo">目前顯示設定的主線、插件建立的分支，以及它們的原生後代分支。節點標題先使用原文短句，可手動改名。</p><pre id="diagnostic-text" data-i18n="waitingHost">等待宿主連接</pre></details>
  </main>
  <dialog id="dialog"><form id="branch-form"><div class="eyebrow" data-i18n="exploreBranch">EXPLORE A BRANCH</div><h2 id="dialog-title" data-i18n="branchFromHere">從這裡建立分支</h2><p id="dialog-description"></p><label for="branch-name" data-i18n="name">名稱</label><input id="branch-name" maxlength="60" required autocomplete="off" placeholder="例如：比較兩種方案" data-i18n-placeholder="branchPlaceholder"><div class="dialog-actions"><button type="button" id="cancel" class="quiet" data-i18n="cancel">取消</button><button type="submit" id="confirm" class="primary" data-i18n="createBranch">建立分支</button></div><p id="dialog-error" class="error" role="alert"></p></form></dialog>
  <script type="module">/* INLINE_SCRIPT */</script>
</body></html>
